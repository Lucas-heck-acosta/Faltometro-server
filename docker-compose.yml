services:
  mysql:
    container_name: 'mysql-faltometro'
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=faltometroDB'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'

networks:
  postgres-compose-network:
    driver: bridge